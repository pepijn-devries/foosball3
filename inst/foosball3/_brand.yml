# _brand.yml
meta:
  name:
    full: "Foosball 3.0"

logo:
  images:
    arcade-light-bg: "www/img/logo-black.png"
    arcade-dark-bg: "www/img/logo-white.png"
    
defaults:
  shiny:
    theme:
      preset: shiny
      rules: |
        .navbar-brand { 
          display: inline-flex;
          align-items: center;
          gap: 12px;
        }
        
        .navbar-brand::before {
          content: "";
          display: inline-block;
          height: 32px;
          width: 32px;
          background-size: contain;
          background-repeat: no-repeat;
          background-position: center;
          background-image: url('/img/web-app-manifest-192x192.png');
        }
